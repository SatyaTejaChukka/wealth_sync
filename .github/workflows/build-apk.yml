name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'frontend/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with latest.json metadata'
        required: false
        type: boolean
        default: false
      release_version:
        description: 'Version tag (e.g. v1.1.0)'
        required: false
        type: string
        default: ''

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Accept Android SDK Licenses & Prepare Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" 2>/dev/null || sdkmanager "platforms;android-36" 2>/dev/null || true

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://wealth-sync.onrender.com/api/v1
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDafP0uJrTnbW6d0GwrdgGBYzqXPvibusg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'wealthsync-app-b24c1.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'wealthsync-app-b24c1' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'wealthsync-app-b24c1.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '773706147941' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:773706147941:web:dd0605169928135c7fbe8c' }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID || '773706147941-0c3jjgq0kdjgkntpsqi3f483ceghul34.apps.googleusercontent.com' }}
        run: npm run build

      - name: Sync Capacitor Android Native Layer
        working-directory: frontend
        run: npx cap sync android

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json
          fi

      - name: Restore Production Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/release.keystore
            echo "Production release keystore restored."
          else
            echo "::warning ::ANDROID_KEYSTORE_BASE64 secret not provided. Building with fallback debug keystore."
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Build Android Release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "release.keystore" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Package & Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          if [ -f "frontend/android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="frontend/android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_version }}" ]; then
            TAG_NAME="${{ inputs.release_version }}"
          fi
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi

          VERSION_CLEAN=$(echo "$TAG_NAME" | sed 's/^v//')
          cp "$APK_PATH" "./WealthSync-${TAG_NAME}.apk"

          FILE_SIZE=$(stat -c%s "./WealthSync-${TAG_NAME}.apk" 2>/dev/null || stat -f%z "./WealthSync-${TAG_NAME}.apk")
          SHA256_HASH=$(sha256sum "./WealthSync-${TAG_NAME}.apk" | awk '{print $1}')

          mkdir -p release
          cat <<EOF > release/latest.json
          {
            "versionCode": 2,
            "versionName": "${VERSION_CLEAN}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/WealthSync-${TAG_NAME}.apk",
            "fileSizeBytes": ${FILE_SIZE},
            "sha256": "${SHA256_HASH}",
            "releaseNotes": "Native Android release with in-app updater and Capgo OTA synchronization.",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "apk_path=./WealthSync-${TAG_NAME}.apk" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WealthSync-${{ steps.prepare_artifacts.outputs.tag_name }}-APK
          path: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            release/latest.json
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: WealthSync ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
