name: OTA Web Bundle Update (Capgo)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/capacitor.config.json'
  workflow_dispatch:

jobs:
  deploy-ota:
    name: Deploy Capgo OTA Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://wealth-sync.onrender.com/api/v1
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Deploy OTA Bundle to Capgo Channel
        working-directory: frontend
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -n "$CAPGO_TOKEN" ]; then
            # Generate a unique OTA version: base version + build timestamp
            BASE_VERSION=$(node -p "require('./package.json').version")
            BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)
            OTA_VERSION="${BASE_VERSION}+${BUILD_NUMBER}"

            # Temporarily set the unique version in package.json for the upload
            node -e "const p=require('./package.json'); p.version='${OTA_VERSION}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"

            echo "Uploading OTA bundle version: ${OTA_VERSION}"
            npx @capgo/cli@latest bundle upload --channel=production
          else
            echo "::warning ::CAPGO_TOKEN secret is not set. Bundle upload skipped. Add CAPGO_TOKEN to GitHub repository secrets to enable OTA deployment."
          fi
