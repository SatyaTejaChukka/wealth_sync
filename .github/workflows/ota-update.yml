name: OTA Web Bundle Update (Capgo)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/capacitor.config.json'
  workflow_dispatch:

jobs:
  deploy-ota:
    name: Deploy Capgo OTA Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://wealth-sync.onrender.com/api/v1
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDafP0uJrTnbW6d0GwrdgGBYzqXPvibusg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'wealthsync-app-b24c1.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'wealthsync-app-b24c1' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'wealthsync-app-b24c1.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '773706147941' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:773706147941:web:dd0605169928135c7fbe8c' }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID || '773706147941-0c3jjgq0kdjgkntpsqi3f483ceghul34.apps.googleusercontent.com' }}
        run: npm run build

      - name: Deploy OTA Bundle to Capgo Channel
        working-directory: frontend
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -n "$CAPGO_TOKEN" ]; then
            npx @capgo/cli@latest bundle upload --channel=production
          else
            echo "::warning ::CAPGO_TOKEN secret is not set. Bundle upload skipped. Add CAPGO_TOKEN to GitHub repository secrets to enable OTA deployment."
          fi
